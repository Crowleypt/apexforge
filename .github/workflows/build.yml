name: Build and Push ApexForge Docker Image

# Pushes to main build a test image tagged with the commit SHA only.
# Release: push a git tag like v1.1.0 (must match APEXFORGE_VERSION in
# start_final.sh) to publish :v1.1.0 and move :latest.
on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'start_final.sh'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 0. Free up disk space ─────────────────────────────────
      # GitHub free runners only have ~14GB. The CUDA base image + PyTorch
      # fills this before the build completes. This removes pre-installed
      # tools we don't need, freeing ~10GB before the build starts.
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune -af
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      # ── 1. Check out the repo ─────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1b. Release tag must match the script version ─────────
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          SCRIPT_VERSION=$(grep -oP '^APEXFORGE_VERSION="\K[^"]+' start_final.sh)
          if [ "v$SCRIPT_VERSION" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match APEXFORGE_VERSION=$SCRIPT_VERSION"
            exit 1
          fi

      # ── 2. Set up Docker Buildx ──────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Log in to Docker Hub ──────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Build and push ────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/apexforge:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/apexforge:{1}', secrets.DOCKERHUB_USERNAME, github.ref_name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/apexforge:latest', secrets.DOCKERHUB_USERNAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 5. Confirm ───────────────────────────────────────────
      - name: Image built successfully
        run: |
          echo "=================================================="
          echo "ApexForge image pushed to Docker Hub!"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/apexforge:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"
          echo "=================================================="
